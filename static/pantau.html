<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ingat · Monitor</title>
<style>
  :root{
    --bg:#f5f5f7; --kaca:rgba(255,255,255,.72); --kartu:#ffffff; --kartu2:#fafafc;
    --tinta:#1d1d1f; --tinta2:#6e6e73; --tinta3:#aeaeb2;
    --garis:rgba(0,0,0,.08); --garis2:rgba(0,0,0,.05);
    --biru:#0071e3; --hijau:#34c759; --oranye:#ff9f0a; --merah:#ff3b30; --teal:#5ac8fa; --abu:#8e8e93;
    --bayang:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
    --bayang-naik:0 2px 6px rgba(0,0,0,.06),0 18px 40px rgba(0,0,0,.10);
    --r:18px; --r2:12px; --pil:980px;
    --lentur:cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#000; --kaca:rgba(28,28,30,.66); --kartu:#1c1c1e; --kartu2:#242426;
      --tinta:#f5f5f7; --tinta2:#a1a1a6; --tinta3:#636366;
      --garis:rgba(255,255,255,.10); --garis2:rgba(255,255,255,.06);
      --biru:#0a84ff; --hijau:#30d158; --oranye:#ff9f0a; --merah:#ff453a; --teal:#64d2ff; --abu:#98989d;
      --bayang:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
      --bayang-naik:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.6);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tinta);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Inter,Roboto,sans-serif;
    background-image:radial-gradient(60% 40% at 15% 0%,color-mix(in srgb,var(--biru) 10%,transparent),transparent 70%)}
  :focus-visible{outline:3px solid color-mix(in srgb,var(--biru) 45%,transparent);outline-offset:2px;border-radius:var(--r2)}

  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 20px;
    border-bottom:1px solid var(--garis);background:var(--kaca);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:5}
  .logo{width:26px;height:26px;border-radius:7px;flex:none;position:relative;
    background:linear-gradient(135deg,var(--biru),#af52de);box-shadow:0 2px 8px color-mix(in srgb,var(--biru) 40%,transparent)}
  .logo::after{content:"";position:absolute;inset:7.5px;border-radius:50%;background:#fff}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.02em}
  .badge{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:var(--pil);white-space:nowrap;
    color:var(--tinta2);background:color-mix(in srgb,var(--tinta) 6%,transparent)}
  .badge.otoritatif{color:var(--hijau);background:color-mix(in srgb,var(--hijau) 12%,transparent)}
  .badge.relay{color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent)}
  .sisa{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--tinta2);font-size:12.5px}
  .status{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--pil);
    background:color-mix(in srgb,var(--tinta) 6%,transparent);font-weight:500}
  .titik{width:8px;height:8px;border-radius:50%;background:var(--hijau);display:inline-block;
    box-shadow:0 0 0 3px color-mix(in srgb,var(--hijau) 25%,transparent);animation:denyut 2.4s ease-in-out infinite;transition:background .3s}
  .titik.mati{background:var(--merah);box-shadow:0 0 0 3px color-mix(in srgb,var(--merah) 25%,transparent);animation:none}
  @keyframes denyut{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--hijau) 25%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--hijau) 8%,transparent)}}
  #waktu{font-variant-numeric:tabular-nums}
  #waktu.denyut{animation:kedip .6s ease}
  @keyframes kedip{0%{color:var(--biru)}100%{color:var(--tinta2)}}

  .tombol{font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--tinta);text-decoration:none;
    background:var(--kartu);border:1px solid var(--garis);border-radius:var(--pil);padding:7px 14px;
    display:inline-flex;align-items:center;gap:6px;box-shadow:var(--bayang);
    transition:transform .14s var(--lentur),box-shadow .18s,background .18s,border-color .18s}
  .tombol:hover{box-shadow:var(--bayang-naik);transform:translateY(-1px);border-color:color-mix(in srgb,var(--biru) 40%,var(--garis))}
  .tombol:active{transform:scale(.955);box-shadow:none}
  .tombol.utama{background:var(--biru);color:#fff;border-color:transparent}
  .tombol.utama:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--biru) 38%,transparent)}

  main{max-width:1120px;margin:0 auto;padding:26px 20px}
  .kabar{margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
  .lonceng{padding:13px 16px;border-radius:var(--r2);font-weight:500;line-height:1.45;display:flex;gap:10px;align-items:flex-start;
    animation:naik .4s var(--lentur) both;border:1px solid transparent}
  .lonceng b{font-weight:700}
  .lonceng.bahaya{background:color-mix(in srgb,var(--merah) 12%,var(--kartu));color:var(--merah);border-color:color-mix(in srgb,var(--merah) 25%,transparent)}
  .lonceng.hati{background:color-mix(in srgb,var(--oranye) 13%,var(--kartu));color:color-mix(in srgb,var(--oranye) 80%,var(--tinta));border-color:color-mix(in srgb,var(--oranye) 28%,transparent)}
  .lonceng.tenang{background:color-mix(in srgb,var(--hijau) 11%,var(--kartu));color:color-mix(in srgb,var(--hijau) 75%,var(--tinta));border-color:color-mix(in srgb,var(--hijau) 25%,transparent)}
  .lonceng.info{background:var(--kartu);color:var(--tinta2);border-color:var(--garis2);box-shadow:var(--bayang)}
  @keyframes naik{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .kartu-baris{display:grid;grid-template-columns:repeat(auto-fit,minmax(164px,1fr));gap:14px;margin-bottom:22px}
  .kartu{position:relative;background:var(--kartu);border:1px solid var(--garis2);border-radius:var(--r);padding:18px 18px 16px;
    box-shadow:var(--bayang);overflow:hidden;cursor:default;animation:naik .45s var(--lentur) both;
    transition:transform .18s var(--lentur),box-shadow .2s}
  .kartu:nth-child(2){animation-delay:.04s}.kartu:nth-child(3){animation-delay:.08s}.kartu:nth-child(4){animation-delay:.12s}
  .kartu:nth-child(5){animation-delay:.16s}.kartu:nth-child(6){animation-delay:.2s}
  .kartu:hover{transform:translateY(-3px);box-shadow:var(--bayang-naik)}
  .kartu:active{transform:scale(.975)}
  .kartu.utama{background:linear-gradient(140deg,var(--biru),color-mix(in srgb,var(--biru) 70%,#af52de));color:#fff;border-color:transparent;
    box-shadow:0 10px 28px color-mix(in srgb,var(--biru) 38%,transparent)}
  .kartu.utama .judul,.kartu.utama .imbuh{color:rgba(255,255,255,.8)}
  .kartu .angka{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .kartu .judul{color:var(--tinta2);font-size:12px;margin-top:6px;font-weight:600}
  .kartu .imbuh{color:var(--tinta3);font-size:12px;margin-top:6px;font-weight:500}
  .kartu .imbuh.peringatan{color:var(--oranye)}

  .panel-baris{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.panel-baris{grid-template-columns:1fr}}
  .panel{background:var(--kartu);border:1px solid var(--garis2);border-radius:var(--r);padding:20px 22px;box-shadow:var(--bayang);
    animation:naik .5s var(--lentur) both;animation-delay:.2s}
  .panel h2{font-size:15px;margin:0 0 16px;font-weight:700;letter-spacing:-.02em}
  .rincian{display:flex;flex-direction:column;gap:12px}
  .rinci{display:grid;grid-template-columns:104px 1fr 40px;align-items:center;gap:12px;font-size:13.5px;
    padding:4px 6px;margin:0 -6px;border-radius:9px;transition:background .16s}
  .rinci:hover{background:color-mix(in srgb,var(--tinta) 4%,transparent)}
  @media(max-width:400px){.rinci{grid-template-columns:88px 1fr 34px;gap:8px}}
  .rinci .nama{color:var(--tinta2);text-transform:capitalize;font-weight:500}
  .rinci .nilai{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .rinci .nilai.nol{color:var(--tinta3);font-weight:500}
  .bar{height:8px;border-radius:999px;background:color-mix(in srgb,var(--tinta) 8%,transparent);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:999px;transition:width .7s var(--lentur)}
  .s-hipotesis>span,.s-draf>span{background:var(--abu)}
  .s-usulan>span,.s-teruji>span{background:var(--biru)}
  .s-aturan>span,.s-aktif>span{background:var(--hijau)}
  .s-dipersempit>span{background:var(--oranye)}
  .s-ditarik>span{background:var(--merah)}

  .rangka{background:var(--kartu);border:1px solid var(--garis2);border-radius:var(--r);height:96px;box-shadow:var(--bayang);position:relative;overflow:hidden}
  .rangka::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tinta) 6%,transparent),transparent);
    transform:translateX(-100%);animation:geser 1.3s infinite}
  @keyframes geser{100%{transform:translateX(100%)}}

  footer{max-width:1120px;margin:0 auto;padding:12px 20px 34px;color:var(--tinta3);font-size:12px}
  code{background:color-mix(in srgb,var(--tinta) 7%,transparent);padding:2px 7px;border-radius:6px;font-size:12px;color:var(--tinta2);
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"></div>
  <h1>ingat · Monitor</h1>
  <span id="mode" class="badge">…</span>
  <span id="embed" class="badge" title="embedder">…</span>
  <div class="sisa">
    <span class="status" id="status"><span class="titik" id="titik"></span><span id="statusteks">menghubungkan…</span></span>
    <span id="waktu" aria-live="polite">—</span>
    <a class="tombol" href="/graf" aria-label="Buka tampilan graf">◕ Graf</a>
    <a class="tombol" href="/timeline" aria-label="Buka timeline">◷ Timeline</a>
    <button class="tombol" id="jeda" aria-label="Jeda pembaruan otomatis">⏸ Jeda</button>
    <button class="tombol utama" id="segar" aria-label="Segarkan sekarang">↻ Segarkan</button>
  </div>
</header>
<main>
  <div class="kabar" id="kabar" aria-live="polite"></div>
  <div class="kartu-baris" id="kartu-utama" aria-busy="true">
    <div class="rangka"></div><div class="rangka"></div><div class="rangka"></div>
    <div class="rangka"></div><div class="rangka"></div><div class="rangka"></div>
  </div>
  <div class="panel-baris">
    <div class="panel">
      <h2>Pelajaran menurut status</h2>
      <div class="rincian" id="r-pelajaran"></div>
    </div>
    <div class="panel">
      <h2>Prosedur menurut status</h2>
      <div class="rincian" id="r-prosedur"></div>
    </div>
  </div>
  <div class="panel" id="panel-tinjau" style="margin-top:16px;display:none">
    <h2 style="color:var(--oranye)">⚠ Perlu ditinjau</h2>
    <div class="rincian" id="r-tinjau"></div>
  </div>
</main>
<footer>
  <span id="kaki">ingat</span> · monitor localhost baca-saja · auto-segar tiap 5 dtk ·
  data dari <code>ringkasan_metrik()</code>
</footer>
<script>
"use strict";
const N = (x)=> (x==null?0:x);
const el = (id)=>document.getElementById(id);
let jeda=false, timer=null, pertama=true;

function warnaTitik(hidup){ el("titik").classList.toggle("mati",!hidup); }

function kartu(angka,judul,imbuh,opsi){
  opsi = opsi||{};
  const d=document.createElement("div"); d.className="kartu"+(opsi.utama?" utama":"");
  d.innerHTML=`<div class="angka">${angka}</div><div class="judul">${judul}</div>`+
    (imbuh?`<div class="imbuh${opsi.peringatan?" peringatan":""}">${imbuh}</div>`:"");
  return d;
}

function rinci(wadah, kelas, nama, nilai, maks){
  const pct = maks>0 ? Math.round(nilai/maks*100) : 0;
  const d=document.createElement("div"); d.className="rinci";
  d.innerHTML=`<span class="nama">${nama}</span>`+
    `<span class="bar ${kelas}"><span style="width:0%"></span></span>`+
    `<span class="nilai${nilai?"":" nol"}">${nilai}</span>`;
  wadah.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ d.querySelector(".bar>span").style.width=pct+"%"; }));
}

function lonceng(kelas, html){
  const l=document.createElement("div"); l.className="lonceng "+kelas; l.innerHTML=html;
  el("kabar").appendChild(l);
}

function render(d){
  const m = d.metrik||{};
  const mode = d.mode||"—";
  const bm = el("mode"); bm.textContent = mode;
  bm.className = "badge "+(mode.startsWith("relay")?"relay":"otoritatif");
  const e = d.embedding||{};
  el("embed").textContent = (e.jenis||"?")+" · "+(e.model||"?")+(e.dim?(" · "+e.dim+"d"):"");
  el("kaki").textContent = "ingat v"+(d.versi||"?")+" · "+(d.dir_data||"");

  const kabar = el("kabar"); kabar.innerHTML="";
  const alarm = m.alarm||[];
  alarm.forEach(a=> lonceng("bahaya","⚠ <span>"+(typeof a==="string"?a:JSON.stringify(a))+"</span>"));
  const berturut = N(m.sesi_tanpa_episode_berturut);
  if(berturut>=3) lonceng("hati","⚠ <span><b>"+berturut+" sesi berturut</b> tanpa episode — hook penangkap mungkin tidak jalan.</span>");
  if(N(m.tinjau_ulang)>0) lonceng("hati","✎ <span><b>"+m.tinjau_ulang+"</b> item menunggu tinjau ulang.</span>");

  const pjl = N(m.pelajaran_hipotesis)+N(m.pelajaran_usulan)+N(m.pelajaran_aturan)+N(m.pelajaran_dipersempit)+N(m.pelajaran_ditarik);
  const prl = N(m.prosedur_draf)+N(m.prosedur_teruji)+N(m.prosedur_aktif)+N(m.prosedur_dipersempit)+N(m.prosedur_ditarik);
  const totalIsi = N(m.episode_aktif)+pjl+prl+N(m.norma);
  const ku = el("kartu-utama"); ku.innerHTML=""; ku.setAttribute("aria-busy","false");

  if(totalIsi===0){
    lonceng("info","○ <span>Store masih kosong — belum ada memori tersimpan. Jalankan hook / ekstensi, lalu data akan muncul di sini.</span>");
  } else if(alarm.length===0 && berturut<3){
    lonceng("tenang","✓ <span>Tidak ada alarm. Store sehat.</span>");
  }

  ku.appendChild(kartu(N(m.episode_aktif),"Episode aktif", N(m.episode_didinginkan)+" didinginkan", {utama:true}));
  ku.appendChild(kartu(pjl,"Pelajaran", N(m.pelajaran_usulan)+" usulan · "+N(m.pelajaran_aturan)+" aturan"));
  ku.appendChild(kartu(prl,"Prosedur", N(m.prosedur_aktif)+" aktif · "+N(m.prosedur_draf)+" draf"));
  ku.appendChild(kartu(N(m.norma),"Norma"));
  ku.appendChild(kartu(N(m.tinjau_ulang),"Tinjau ulang", N(m.tinjau_ulang)>0?"perlu perhatian":"bersih", {peringatan:N(m.tinjau_ulang)>0}));
  ku.appendChild(kartu(N(m.sesi_tanpa_episode),"Sesi tanpa episode", berturut+" berturut", {peringatan:berturut>=3}));

  const rp = el("r-pelajaran"); rp.innerHTML="";
  const pel=[["hipotesis","s-hipotesis",m.pelajaran_hipotesis],["usulan","s-usulan",m.pelajaran_usulan],
    ["aturan","s-aturan",m.pelajaran_aturan],["dipersempit","s-dipersempit",m.pelajaran_dipersempit],
    ["ditarik","s-ditarik",m.pelajaran_ditarik]];
  const maxp = Math.max(1,...pel.map(x=>N(x[2])));
  pel.forEach(x=>rinci(rp,x[1],x[0],N(x[2]),maxp));

  const rpr = el("r-prosedur"); rpr.innerHTML="";
  const pro=[["draf","s-draf",m.prosedur_draf],["teruji","s-teruji",m.prosedur_teruji],
    ["aktif","s-aktif",m.prosedur_aktif],["dipersempit","s-dipersempit",m.prosedur_dipersempit],
    ["ditarik","s-ditarik",m.prosedur_ditarik]];
  const maxpr = Math.max(1,...pro.map(x=>N(x[2])));
  pro.forEach(x=>rinci(rpr,x[1],x[0],N(x[2]),maxpr));

  const tj = d.tinjau||{};
  const panelTj = el("panel-tinjau");
  const rTj = el("r-tinjau");
  if(tj.total>0){
    panelTj.style.display="";
    rTj.innerHTML="";
    (tj.daftar||[]).forEach(item=>{
      const r=document.createElement("div"); r.className="rinci";
      r.style.gridTemplateColumns="80px 1fr";
      r.innerHTML=`<span class="nama" style="color:var(--oranye)">${item.jenis}</span><span style="font-size:13px">${item.teks}</span>`;
      rTj.appendChild(r);
    });
  } else {
    panelTj.style.display="none";
  }

  const w = el("waktu");
  w.textContent = "diperbarui "+new Date().toLocaleTimeString("id-ID");
  w.classList.remove("denyut"); void w.offsetWidth; w.classList.add("denyut");
  el("statusteks").textContent = "terhubung"; warnaTitik(true);
  pertama=false;
}

async function tarik(){
  try{
    const r = await fetch("/data",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    render(await r.json());
  }catch(err){
    el("statusteks").textContent = "gagal"; warnaTitik(false);
    if(pertama){
      el("kartu-utama").innerHTML="";
      el("kabar").innerHTML="";
      lonceng("bahaya","⚠ <span>Tidak bisa menghubungi server monitor: "+err.message+
        ". Pastikan <code>ingat pantau</code> berjalan.</span>");
    }
  }
}
function jadwalkan(){ clearInterval(timer); if(!jeda) timer=setInterval(tarik,5000); }
el("segar").onclick = tarik;
el("jeda").onclick = ()=>{ jeda=!jeda; el("jeda").textContent = jeda?"▶ Lanjut":"⏸ Jeda";
  el("jeda").setAttribute("aria-label", jeda?"Lanjutkan pembaruan otomatis":"Jeda pembaruan otomatis");
  jadwalkan(); if(!jeda) tarik(); };
tarik(); jadwalkan();
</script>
</body>
</html>
