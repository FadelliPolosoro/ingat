<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ingat · Monitor</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --tepi:#e3e6ea; --teks:#1c2024; --redup:#6b7280;
    --aksen:#2563eb; --ok:#16a34a; --hati:#d97706; --bahaya:#dc2626; --dingin:#0891b2;
    --bayang:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1114; --panel:#181b1f; --tepi:#2a2f36; --teks:#e6e8ea; --redup:#9aa3ad;
      --aksen:#5b8cff; --ok:#4ade80; --hati:#fbbf24; --bahaya:#f87171; --dingin:#38bdf8;
      --bayang:0 1px 3px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--teks);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 20px;
    border-bottom:1px solid var(--tepi);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--tepi)}
  .badge.otoritatif{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .badge.relay{color:var(--dingin);border-color:color-mix(in srgb,var(--dingin) 40%,transparent)}
  .sisa{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--redup);font-size:12px}
  .titik{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}
  .titik.mati{background:var(--bahaya)}
  button{font:inherit;cursor:pointer;background:var(--panel);color:var(--teks);
    border:1px solid var(--tepi);border-radius:8px;padding:5px 12px}
  button:hover{border-color:var(--aksen)}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .kabar{margin-bottom:16px}
  .lonceng{padding:12px 16px;border-radius:10px;margin-bottom:8px;font-weight:500;
    border:1px solid transparent;display:flex;gap:10px;align-items:flex-start}
  .lonceng.bahaya{background:color-mix(in srgb,var(--bahaya) 12%,var(--panel));border-color:color-mix(in srgb,var(--bahaya) 35%,transparent);color:var(--bahaya)}
  .lonceng.hati{background:color-mix(in srgb,var(--hati) 12%,var(--panel));border-color:color-mix(in srgb,var(--hati) 35%,transparent);color:var(--hati)}
  .lonceng.tenang{background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
  .kartu-baris{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .kartu{background:var(--panel);border:1px solid var(--tepi);border-radius:12px;padding:14px 16px;box-shadow:var(--bayang)}
  .kartu .angka{font-size:30px;font-weight:680;line-height:1.1;letter-spacing:-.5px}
  .kartu .judul{color:var(--redup);font-size:12px;margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
  .kartu .imbuh{color:var(--redup);font-size:12px;margin-top:6px}
  .panel-baris{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.panel-baris{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--tepi);border-radius:12px;padding:16px 18px;box-shadow:var(--bayang)}
  .panel h2{font-size:13px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.5px;color:var(--redup)}
  .rincian{display:flex;flex-direction:column;gap:10px}
  .rinci{display:grid;grid-template-columns:110px 1fr 38px;align-items:center;gap:10px;font-size:13px}
  .rinci .nama{color:var(--redup);text-transform:capitalize}
  .rinci .nilai{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .bar{height:8px;border-radius:999px;background:color-mix(in srgb,var(--redup) 18%,transparent);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:999px}
  .s-hipotesis>span,.s-draf>span{background:var(--redup)}
  .s-usulan>span,.s-teruji>span{background:var(--aksen)}
  .s-aturan>span,.s-aktif>span{background:var(--ok)}
  .s-dipersempit>span{background:var(--hati)}
  .s-ditarik>span{background:var(--bahaya)}
  footer{max-width:1100px;margin:0 auto;padding:8px 20px 28px;color:var(--redup);font-size:12px}
  code{background:color-mix(in srgb,var(--redup) 14%,transparent);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>ingat · Monitor</h1>
  <span id="mode" class="badge">…</span>
  <span id="embed" class="badge" title="embedder">…</span>
  <div class="sisa">
    <span id="status"><span class="titik" id="titik"></span><span id="statusteks">menghubungkan…</span></span>
    <span id="waktu">—</span>
    <button id="jeda">⏸ Jeda</button>
    <button id="segar">↻ Segarkan</button>
  </div>
</header>
<main>
  <div class="kabar" id="kabar"></div>
  <div class="kartu-baris" id="kartu-utama"></div>
  <div class="panel-baris">
    <div class="panel">
      <h2>Pelajaran menurut status</h2>
      <div class="rincian" id="r-pelajaran"></div>
    </div>
    <div class="panel">
      <h2>Prosedur menurut status</h2>
      <div class="rincian" id="r-prosedur"></div>
    </div>
  </div>
</main>
<footer>
  <span id="kaki">ingat</span> · monitor localhost baca-saja · auto-segar tiap 5 dtk ·
  data dari <code>ringkasan_metrik()</code>
</footer>
<script>
"use strict";
const N = (x)=> (x==null?0:x);
const el = (id)=>document.getElementById(id);
let jeda=false, timer=null;

function warnaTitik(hidup){ el("titik").classList.toggle("mati",!hidup); }

function kartu(angka,judul,imbuh){
  const d=document.createElement("div"); d.className="kartu";
  d.innerHTML=`<div class="angka">${angka}</div><div class="judul">${judul}</div>`+
    (imbuh?`<div class="imbuh">${imbuh}</div>`:"");
  return d;
}

function rinci(wadah, kelas, nama, nilai, maks){
  const pct = maks>0 ? Math.round(nilai/maks*100) : 0;
  const d=document.createElement("div"); d.className="rinci";
  d.innerHTML=`<span class="nama">${nama}</span>`+
    `<span class="bar ${kelas}"><span style="width:${pct}%"></span></span>`+
    `<span class="nilai">${nilai}</span>`;
  wadah.appendChild(d);
}

function render(d){
  const m = d.metrik||{};
  // header
  const mode = d.mode||"—";
  const bm = el("mode"); bm.textContent = mode;
  bm.className = "badge "+(mode.startsWith("relay")?"relay":"otoritatif");
  const e = d.embedding||{};
  el("embed").textContent = (e.jenis||"?")+" · "+(e.model||"?")+(e.dim?(" · "+e.dim+"d"):"");
  el("kaki").textContent = "ingat v"+(d.versi||"?")+" · "+(d.dir_data||"");

  // kabar (alarm + peringatan sesi)
  const kabar = el("kabar"); kabar.innerHTML="";
  const alarm = m.alarm||[];
  alarm.forEach(a=>{
    const l=document.createElement("div"); l.className="lonceng bahaya";
    l.innerHTML="⚠ <span>"+(typeof a==="string"?a:JSON.stringify(a))+"</span>"; kabar.appendChild(l);
  });
  const berturut = N(m.sesi_tanpa_episode_berturut);
  if(berturut>=3){
    const l=document.createElement("div"); l.className="lonceng hati";
    l.innerHTML="⚠ <span>"+berturut+" sesi berturut tanpa episode — hook penangkap mungkin tidak jalan.</span>";
    kabar.appendChild(l);
  }
  if(N(m.tinjau_ulang)>0){
    const l=document.createElement("div"); l.className="lonceng hati";
    l.innerHTML="✎ <span>"+m.tinjau_ulang+" item menunggu tinjau ulang.</span>"; kabar.appendChild(l);
  }
  if(alarm.length===0 && berturut<3){
    const l=document.createElement("div"); l.className="lonceng tenang";
    l.innerHTML="✓ <span>Tidak ada alarm. Store sehat.</span>"; kabar.appendChild(l);
  }

  // kartu utama
  const pjl = N(m.pelajaran_hipotesis)+N(m.pelajaran_usulan)+N(m.pelajaran_aturan)+N(m.pelajaran_dipersempit)+N(m.pelajaran_ditarik);
  const prl = N(m.prosedur_draf)+N(m.prosedur_teruji)+N(m.prosedur_aktif)+N(m.prosedur_dipersempit)+N(m.prosedur_ditarik);
  const ku = el("kartu-utama"); ku.innerHTML="";
  ku.appendChild(kartu(N(m.episode_aktif),"Episode aktif", N(m.episode_didinginkan)+" didinginkan"));
  ku.appendChild(kartu(pjl,"Pelajaran", N(m.pelajaran_usulan)+" usulan · "+N(m.pelajaran_aturan)+" aturan"));
  ku.appendChild(kartu(prl,"Prosedur", N(m.prosedur_aktif)+" aktif · "+N(m.prosedur_draf)+" draf"));
  ku.appendChild(kartu(N(m.norma),"Norma"));
  ku.appendChild(kartu(N(m.tinjau_ulang),"Tinjau ulang", N(m.tinjau_ulang)>0?"perlu perhatian":"bersih"));
  ku.appendChild(kartu(N(m.sesi_tanpa_episode),"Sesi tanpa episode", berturut+" berturut"));

  // rincian pelajaran
  const rp = el("r-pelajaran"); rp.innerHTML="";
  const pel=[["hipotesis","s-hipotesis",m.pelajaran_hipotesis],["usulan","s-usulan",m.pelajaran_usulan],
    ["aturan","s-aturan",m.pelajaran_aturan],["dipersempit","s-dipersempit",m.pelajaran_dipersempit],
    ["ditarik","s-ditarik",m.pelajaran_ditarik]];
  const maxp = Math.max(1,...pel.map(x=>N(x[2])));
  pel.forEach(x=>rinci(rp,x[1],x[0],N(x[2]),maxp));

  // rincian prosedur
  const rpr = el("r-prosedur"); rpr.innerHTML="";
  const pro=[["draf","s-draf",m.prosedur_draf],["teruji","s-teruji",m.prosedur_teruji],
    ["aktif","s-aktif",m.prosedur_aktif],["dipersempit","s-dipersempit",m.prosedur_dipersempit],
    ["ditarik","s-ditarik",m.prosedur_ditarik]];
  const maxpr = Math.max(1,...pro.map(x=>N(x[2])));
  pro.forEach(x=>rinci(rpr,x[1],x[0],N(x[2]),maxpr));

  el("waktu").textContent = "diperbarui "+new Date().toLocaleTimeString("id-ID");
  el("statusteks").textContent = "terhubung"; warnaTitik(true);
}

async function tarik(){
  try{
    const r = await fetch("/data",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    render(await r.json());
  }catch(err){
    el("statusteks").textContent = "gagal: "+err.message; warnaTitik(false);
  }
}
function jadwalkan(){ clearInterval(timer); if(!jeda) timer=setInterval(tarik,5000); }
el("segar").onclick = tarik;
el("jeda").onclick = ()=>{ jeda=!jeda; el("jeda").textContent = jeda?"▶ Lanjut":"⏸ Jeda"; jadwalkan(); if(!jeda) tarik(); };
tarik(); jadwalkan();
</script>
</body>
</html>
